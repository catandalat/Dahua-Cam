[project]
name = "dahua-anpr"
version = "0.1.0"
description = "ANPR operations system for Dahua ITC413 multi-gate sites"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.10",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "redis>=5.2.0",
  "python-multipart>=0.0.17",
  "orjson>=3.10.0",
  "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0", "pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
probe-camera = "dahua_client.cli:probe_main"
anpr-listener = "listener.main:main"
anpr-backfill = "listener.backfill:main"
anpr-retention = "listener.retention:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages", "apps"]
include = ["dahua_client*", "domain*", "api*", "listener*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
